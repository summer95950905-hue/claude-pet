<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>deskpet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage">
      <div class="pet" data-id="scout">
        <div class="bubble"></div>
        <div class="body">🦝</div>
        <div class="prop">🔭</div>
        <div class="name">Scout</div>
      </div>
      <div class="pet" data-id="knox">
        <div class="bubble"></div>
        <div class="body">🦝</div>
        <div class="prop">🔔</div>
        <div class="name">Knox</div>
      </div>
      <div class="pet" data-id="bubbles">
        <div class="bubble"></div>
        <div class="body">🦝</div>
        <div class="prop">💧</div>
        <div class="name">Bubbles</div>
      </div>
      <div class="pet" data-id="pip">
        <div class="bubble"></div>
        <div class="body">🦝</div>
        <div class="prop">🎉</div>
        <div class="name">Pip</div>
      </div>
    </div>
    <div id="status">idle · waiting for hook events</div>
    <script src="app.js"></script>
  </body>
</html>
